services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - BUILD_ENV=production
        - APP_CHECK_ENFORCE=true
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - APP_CHECK_ENFORCE=true
      - DEBUG_SEEDS=1
      - DEBUG_LOGS=1
    ports:
      - "3001:3001"
    volumes:
      - ./service-account.json:/app/service-account.json:ro
