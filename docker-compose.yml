services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_FIREBASE_API_KEY: "${VITE_FIREBASE_API_KEY:-}"
        VITE_FIREBASE_AUTH_DOMAIN: "${VITE_FIREBASE_AUTH_DOMAIN:-}"
        VITE_FIREBASE_PROJECT_ID: "${VITE_FIREBASE_PROJECT_ID:-}"
        VITE_FIREBASE_APP_ID: "${VITE_FIREBASE_APP_ID:-}"
        VITE_FIREBASE_RECAPTCHA_SITE_KEY: "${VITE_FIREBASE_RECAPTCHA_SITE_KEY:-}"
        VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: "${VITE_FIREBASE_APPCHECK_DEBUG_TOKEN:-}"
        BUILD_ENV: "${BUILD_ENV:-production}"
        APP_CHECK_ENFORCE: "${APP_CHECK_ENFORCE:-true}"
        VITE_ENABLE_ADMIN: "${VITE_ENABLE_ADMIN:-true}"
    # Load container environment values from .env.local
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - APP_CHECK_ENFORCE=true
      - ENABLE_ADMIN=${ENABLE_ADMIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEBUG_SEEDS=1
      - DEBUG_LOGS=1
      - VITE_API_URL
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_PROJECT_ID
      - VITE_FIREBASE_APP_ID
      - VITE_FIREBASE_RECAPTCHA_SITE_KEY
      - VITE_FIREBASE_APPCHECK_DEBUG_TOKEN
      - VITE_ENABLE_ADMIN
    ports:
      - "${PORT}:3001"
    volumes:
      - ./service-account.json:/app/service-account.json:ro
